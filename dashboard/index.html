<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HQ</title>
<link rel="icon" href="data:,">
<!-- The look lives in theme.css: change the colours, the font, the corners there. -->
<link rel="stylesheet" href="/dashboard/theme.css">
</head>
<body>
<header>
  <div class="top">
    <svg class="mark" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18" fill="none" stroke="var(--hud)" stroke-width="1.5" stroke-dasharray="3 3" stroke-opacity=".7"/><circle cx="20" cy="20" r="12" fill="none" stroke="var(--hud)" stroke-width="3"/><circle cx="20" cy="20" r="5" fill="var(--hud)"/></svg>
    <div><h1 id="name">HQ</h1><span class="sub" id="who"></span></div>
    <div class="clock" aria-live="off"><span id="time"></span><small><span class="online"></span><span id="date">online</span></small></div>
  </div>
  <nav role="tablist">
    <button role="tab" data-tab="home" aria-selected="true">Home</button>
    <button role="tab" data-tab="desk" aria-selected="false">Desk<span class="n" id="n-desk">0</span></button>
    <button role="tab" data-tab="board" aria-selected="false">Board<span class="n" id="n-board">0</span></button>
  </nav>
</header>
<main id="main"></main>

<dialog id="recruit">
  <form method="dialog" id="recruit-form">
    <h3>Recruit a role</h3>
    <label for="r-name">Name (who you will talk to)</label><input id="r-name" required placeholder="Tony Stark">
    <label for="r-role">The role, in a few words</label><input id="r-role" required placeholder="the engineer">
    <label for="r-lab">Lab (its folder: lowercase words and hyphens; a child lab goes under its parent)</label><input id="r-lab" required placeholder="engineering" pattern="[a-z0-9\-]+(\/[a-z0-9\-]+)*">
    <label for="r-what">What the lab is, one line</label><input id="r-what" required placeholder="The app: its code, its tests, its deploys">
    <label for="r-does">What the role does, one line (optional)</label><input id="r-does" placeholder="Builds and runs the app">
    <pre id="r-log" hidden></pre>
    <div class="row"><button class="btn" value="cancel" formnovalidate>Close</button><button class="btn primary" id="r-go" value="go">Recruit</button></div>
  </form>
</dialog>

<dialog id="pin">
  <form method="dialog" id="pin-form">
    <h3>Pin a job</h3>
    <label for="p-task">The job, one line</label><input id="p-task" required placeholder="Make the login page pass its tests">
    <label for="p-lab">For which lab</label><select id="p-lab" required></select>
    <div class="row"><button class="btn" value="cancel" formnovalidate>Close</button><button class="btn primary" value="go">Pin it</button></div>
  </form>
</dialog>

<div id="toast" role="status"></div>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const md = (s) => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), 2200); }
function ago(at) {
  const m = (Date.now() - Date.parse(at)) / 60000;
  if (!(m >= 0)) return '';
  return m < 2 ? 'just now' : m < 90 ? `${Math.round(m)} min ago` : m < 36 * 60 ? `${Math.round(m / 60)} h ago` : `${Math.round(m / 1440)} days ago`;
}
let tab = location.pathname.match(/^\/(home|desk|board)/)?.[1] || (() => { try { return localStorage.getItem('hq-tab') || 'home'; } catch { return 'home'; } })();
let home = null, desk = { cards: [], replies: {} }, board = { cards: [] }, showAnswered = false;
const picked = {};   // id -> { v, choice, label, note }: tapped on the desk, not confirmed; nothing is sent until Confirm

// a face: the role's picture (dashboard/avatars/<name>.png), else initials in one of the theme's colours
const avatars = () => Object.fromEntries([[home?.hq.role, home?.hq.avatar], ...(home?.labs || []).map((l) => [l.role || l.holder, l.avatar])]);
function face(name, big) {
  const a = avatars()[name];
  if (a) return `<span class="face${big ? ' big' : ''}"><img src="/${esc(a)}" alt=""></span>`;
  // the interface itself wears the reactor, not initials
  if (name && name === home?.hq.role) return `<span class="face${big ? ' big' : ''}" aria-hidden="true"><svg viewBox="0 0 40 40" width="70%" height="70%"><circle cx="20" cy="20" r="17" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="3 3"/><circle cx="20" cy="20" r="11" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="20" cy="20" r="4.5" fill="currentColor"/></svg></span>`;
  const n = String(name || '?'), init = n.split(/\s+/).map((w) => w[0]).join('').slice(0, 2).toUpperCase();
  let h = 0; for (const c of n) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  return `<span class="face${big ? ' big' : ''}" style="--c:var(--role-${(h % 6) + 1})" aria-hidden="true">${esc(init)}</span>`;
}
const copyBtn = (text) => `<button class="btn small" data-copy="${esc(text)}">Copy folder</button>`;

// ---------------------------------------------------------------- home
const STATE = { ready: 'ready', onboarding: 'onboarding', working: 'working', waiting: 'waiting on you', away: 'not on this machine' };
// The reactor at the centre of Home: rings drawn in SVG, the number of decisions waiting in its core.
function reactor(w) {
  const ticks = Array.from({ length: 60 }, (_, i) => { const a = i * 6 * Math.PI / 180, r1 = i % 5 ? 93 : 89; return `<line x1="${100 + r1 * Math.cos(a)}" y1="${100 + r1 * Math.sin(a)}" x2="${100 + 97 * Math.cos(a)}" y2="${100 + 97 * Math.sin(a)}"/>`; }).join('');
  return `<div class="reactor" role="img" aria-label="${w} decisions waiting on your desk">
    <svg viewBox="0 0 200 200" aria-hidden="true">
      <defs><radialGradient id="rg"><stop offset="0" stop-color="var(--hud)" stop-opacity=".35"/><stop offset="1" stop-color="var(--hud)" stop-opacity="0"/></radialGradient></defs>
      <circle cx="100" cy="100" r="62" fill="url(#rg)"/>
      <g class="spin slow" stroke="var(--hud)" stroke-width="1" stroke-opacity=".55">${ticks}</g>
      <circle cx="100" cy="100" r="84" fill="none" stroke="var(--hud)" stroke-width=".6" stroke-opacity=".35"/>
      <g class="spin"><circle cx="100" cy="100" r="77" fill="none" stroke="var(--hud)" stroke-width="5" stroke-dasharray="52 8 18 8 30 8" stroke-opacity=".8"/></g>
      <g class="spin rev"><circle cx="100" cy="100" r="68" fill="none" stroke="${w ? 'var(--gold)' : 'var(--hud)'}" stroke-width="1.5" stroke-dasharray="2 5" stroke-opacity=".9"/></g>
      <circle cx="100" cy="100" r="58" fill="none" stroke="var(--hud)" stroke-width="1" stroke-opacity=".5"/>
      <g fill="var(--hud)" fill-opacity=".8"><path d="M100 8l4 7h-8z"/><path d="M100 192l4-7h-8z"/><path d="M8 100l7-4v8z"/><path d="M192 100l-7-4v8z"/></g>
    </svg>
    <div class="core"><div class="big${w ? ' hot' : ''}">${w}</div><small>${w === 1 ? 'decision waiting' : 'decisions waiting'}</small></div></div>`;
}
function greeting() { const h = new Date().getHours(); return h < 5 ? 'Working late' : h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening'; }
function renderHome() {
  if (!home) return '';
  const w = desk.cards.filter(waiting).length, needs = board.cards.filter((c) => c.state === 'needs-director' || waitsTap(c)).length;
  const live = board.cards.filter((c) => c.state !== 'done').length, done = board.cards.length - live;
  const online = home.labs.filter((l) => l.state !== 'away').length;
  const first = home.director && home.director !== 'the director' ? home.director.split(/\s+/)[0] : '';
  const summary = w || needs ? `<b>${w} decision${w === 1 ? '' : 's'}</b> on your desk${needs ? ` and <b>${needs} job${needs === 1 ? '' : 's'}</b> that need${needs === 1 ? 's' : ''} you` : ''}.` : 'Nothing needs you. The team is working.';
  const pct = (a, b) => b ? Math.round(100 * a / b) : 0;
  const team = home.labs.map((l) => { const n = l.role || l.holder; return `<article class="panel role">
      <div class="head">${face(n)}<div><h3>${l.role ? esc(l.role) : `<span class="muted">held by ${esc(l.holder)}</span>`}</h3>
        <div class="title">${esc(l.title || '')}</div></div></div><span class="chip ${l.state}">${esc(STATE[l.state])}</span>
      ${l.what ? `<p>${esc(l.what)}</p>` : ''}
      ${l.depth > 1 ? `<div class="under">Inside ${esc(l.path.split('/').slice(0, -1).join('/'))}</div>` : ''}
      <div class="next"><b>NEXT</b>${esc(l.next || 'none written')}</div>
      <div class="open"><span class="path">labs/${esc(l.path)}</span>${copyBtn(l.folder)}</div></article>`; }).join('');
  return `<p class="greet">${greeting()}${first ? `, ${esc(first)}` : ''}.</p><p>${summary}</p>
    <div class="hero">
      <div class="readouts">
        <button class="panel stat" data-go="desk"><div class="label">Desk</div><div class="big${w ? ' hot' : ''}">${w}</div><div class="muted">${w ? 'waiting on you' : 'nothing to decide'}</div><div class="bar"><i class="${w ? 'hot' : ''}" style="width:${pct(w, desk.cards.length)}%"></i></div></button>
        <div class="panel stat"><div class="label">Team</div><div class="big">${online}</div><div class="muted">${online === 1 ? 'role online' : 'roles online'}</div><div class="bar"><i style="width:${pct(online, home.labs.length)}%"></i></div></div>
      </div>
      ${reactor(w)}
      <div class="readouts">
        <button class="panel stat" data-go="board"><div class="label">Board</div><div class="big${needs ? ' hot' : ''}">${live}</div><div class="muted">${live === 1 ? 'job' : 'jobs'} active${needs ? `, ${needs} need${needs === 1 ? 's' : ''} you` : ''}</div><div class="bar"><i style="width:${pct(done, board.cards.length)}%"></i></div></button>
        <div class="panel stat"><div class="label">${esc(home.hq.role)}</div><div class="jarvis-line" style="margin-top:8px"><p>${esc(home.hq.next || 'Standing by.')}</p></div><div class="open">${copyBtn(home.hq.folder)}</div></div>
      </div>
    </div>
    <h2>The team <button class="btn small primary" data-open="recruit">Recruit</button></h2>
    ${team ? `<div class="team">${team}</div>` : `<div class="panel empty"><b>Nobody recruited yet</b>Recruit the first role here, or ask ${esc(home.hq.role)}.</div>`}
    <h2>How it works</h2>
    <ol class="how">
      <li><span>01</span><b>Talk to ${esc(home.hq.role)}</b>Open Claude Code in HQ's folder. ${esc(home.hq.role)} shapes the job and hands it to a role.</li>
      <li><span>02</span><b>Roles work in labs</b>Open Claude Code in a lab's folder and that role answers. A lab sees only itself and the labs inside it.</li>
      <li><span>03</span><b>Decisions come to the desk</b>Every question for you is a card: Keep, Wrong or Later, with a comment.</li>
      <li><span>04</span><b>Keep is the only yes</b>Nothing is decided until you keep it. The role acts on your answer and clears the card.</li>
    </ol>`;
}

// ---------------------------------------------------------------- desk
const waiting = (c) => !desk.replies[c.id] || desk.replies[c.id].v === 'later';
const KIND = { look: 'Look, then decide', try: 'Try it, then decide', choose: 'Pick one', design: 'How it should work', rule: 'Agree or not', do: 'Your task: do these' };
const CHOICES = (c) => c.kind === 'do' ? [['done', 'keep', 'Done'], ['problem', 'wrong', 'Problem'], ['later', 'later', 'Later']]
  : c.kind === 'rule' ? [['keep', 'keep', 'Keep'], ['wrong', 'wrong', 'Wrong']] : [['keep', 'keep', 'Keep'], ['wrong', 'wrong', 'Wrong'], ['later', 'later', 'Later']];
const WORD = { keep: 'Keep', wrong: 'Wrong', later: 'Later', done: 'Done', problem: 'Problem' };
const NEEDS_NOTE = { wrong: "What's wrong? Say what, not how wrong.", problem: 'What happened? Say where it stopped.' };
const labName = (seg) => { if (seg === 'hq') return home?.hq.role || 'HQ'; const l = home?.labs.find((x) => x.path.split('/').pop() === seg); return l ? (l.role || l.holder) : seg; };
function answerArea(c) {
  const p = picked[c.id], r = desk.replies[c.id];
  if (r && !p) {
    const cls = { keep: 'keep', done: 'keep', wrong: 'wrong', problem: 'wrong' }[r.v] || 'later';
    const stale = r.v !== 'later' && Date.now() - Date.parse(r.at) > 864e5;
    return `<div class="answered"><span class="stamp ${cls}">${esc(r.label || WORD[r.v])}</span>${r.note ? `<span>${esc(r.note)}</span>` : ''}<button class="link" data-change="${esc(c.id)}">Change</button>
      ${r.v !== 'later' ? `<span class="age${stale ? ' stale' : ''}">Answered ${esc(ago(r.at))}. ${stale ? 'Not picked up yet.' : `${esc(labName(c.from))} clears it when acting on it.`}</span>` : ''}</div>`;
  }
  const choices = c.kind === 'choose' && c.options?.length
    ? c.options.map((o) => `<button class="btn opt${p?.choice === o.k ? ' on' : ''}" data-pick="${esc(c.id)}" data-v="keep" data-k="${esc(o.k)}" data-t="${esc(o.t)}">${esc(o.t)}${o.rec ? '<span class="rec">suggested</span>' : ''}${o.s ? `<small>${esc(o.s)}</small>` : ''}</button>`).join('')
      + `<button class="btn later${p?.v === 'later' ? ' on' : ''}" data-pick="${esc(c.id)}" data-v="later">Later</button>`
    : CHOICES(c).map(([v, cls, t]) => `<button class="btn ${cls}${p?.v === v && !p?.choice ? ' on' : ''}" data-pick="${esc(c.id)}" data-v="${v}">${t}</button>`).join('');
  const confirm = p ? `<div><textarea id="note-${esc(c.id)}" rows="2" placeholder="${NEEDS_NOTE[p.v] || 'Add a comment (optional)'}" aria-label="Comment">${esc(p.note || '')}</textarea>
    <div class="cbar"><button class="btn primary" data-confirm="${esc(c.id)}">Confirm: ${esc(p.label || WORD[p.v])}</button><button class="btn" data-cancel="${esc(c.id)}">Cancel</button></div></div>` : '';
  return `<div class="acts">${choices}</div>${confirm}`;
}
function deskCard(c) {
  const pics = (c.pictures || []).map((p) => `<img class="pic" src="/desk/pics/${encodeURIComponent(c.id)}/${encodeURIComponent(p.src)}" alt="${esc(p.alt)}">`).join('');
  const steps = c.steps?.length ? `<ol>${c.steps.map((s) => `<li>${md(s)}</li>`).join('')}</ol>` : '';
  return `<article class="panel card${c.kind === 'do' ? ' do' : ''}"><div class="kind"><span>${esc(KIND[c.kind] || 'Decide')}</span><span class="who">${face(labName(c.from))}${esc(labName(c.from))}</span></div>
    ${pics}<h3>${esc(c.title)}</h3>${c.text ? `<p>${md(c.text)}</p>` : ''}${steps}${c.quote ? `<p class="quote">${md(c.quote)}</p>` : ''}${answerArea(c)}</article>`;
}
function renderDesk() {
  const shown = desk.cards.filter((c) => picked[c.id] || (showAnswered ? !waiting(c) : waiting(c)));
  const w = desk.cards.filter(waiting).length;
  return `<div class="bar"><button class="btn small" data-view="waiting" aria-pressed="${!showAnswered}">Waiting (${w})</button><button class="btn small" data-view="answered" aria-pressed="${showAnswered}">Answered (${desk.cards.length - w})</button></div>`
    + (shown.length ? `<div class="grid">${shown.map(deskCard).join('')}</div>`
      : showAnswered ? '<div class="empty"><b>Nothing answered is waiting to clear</b>An answered card stays here until the role that sent it acts on it.</div>'
        : '<div class="empty"><b>Nothing on your desk</b>When a role needs you to decide something, its card lands here.</div>');
}

// ---------------------------------------------------------------- board
const COLS = [['needs-director', 'Needs you'], ['pinned', 'Pinned'], ['taken', 'Taken'], ['done', 'Done']];
const waitsTap = (c) => c.state === 'pinned' && c.from !== 'director' && !c.tapped;
function boardCard(c) {
  let body = '';
  if (waitsTap(c)) body = `<div><button class="btn small primary" data-tap="${esc(c.id)}">Tap to allow</button></div><span class="meta">${esc(c.from)} pinned this for itself. Nothing runs until you tap.</span>`;
  else if (c.state === 'pinned') body = `<span class="meta">${c.from === 'director' ? 'From you, so no tap needed.' : `Tapped ${esc(ago(c.tapped))}.`} Waiting to be taken.</span>`;
  else if (c.state === 'needs-director') body = `<p>${md(c.result || 'Waiting on you.')}</p><textarea id="ans-${esc(c.id)}" rows="2" placeholder="Your answer" aria-label="Your answer"></textarea><div><button class="btn small primary" data-answer="${esc(c.id)}">Send answer</button></div>`;
  else if (c.result) body = `<p class="meta" style="color:var(--ink)">${md(c.result)}</p>`;
  if (c.answer && c.state !== 'needs-director') body += `<span class="meta">You answered: ${esc(c.answer)}</span>`;
  return `<article class="panel"><div class="who">${face(c.role)}${esc(c.role || '')} · ${esc(c.lab || '')}</div><h4>${esc(c.task)}</h4>${body}<span class="meta">pinned ${esc(ago(c.at))} by ${esc(c.from === 'director' ? 'you' : c.from)}</span></article>`;
}
function renderBoard() {
  const head = `<h2>The board <button class="btn small primary" data-open="pin">Pin a job</button></h2>`;
  if (!board.cards.length) return head + '<div class="empty"><b>Nothing pinned</b>Pin a job here, or give one to Jarvis.</div>';
  return head + `<div class="cols">${COLS.map(([s, t]) => { const cs = board.cards.filter((c) => c.state === s); return `<section class="col${s === 'needs-director' ? ' needs' : ''}"><h3><span>${t}</span><span>${cs.length}</span></h3>${cs.map(boardCard).join('')}</section>`; }).join('')}</div>`;
}

// ---------------------------------------------------------------- the frame
function render() {
  const focus = document.activeElement?.id, caret = document.activeElement?.selectionStart;
  document.querySelectorAll('nav button').forEach((b) => b.setAttribute('aria-selected', b.dataset.tab === tab));
  $('#main').innerHTML = tab === 'desk' ? renderDesk() : tab === 'board' ? renderBoard() : renderHome();
  const w = desk.cards.filter(waiting).length, b = board.cards.filter((c) => c.state === 'needs-director' || waitsTap(c)).length;
  $('#n-desk').textContent = w; $('#n-desk').classList.toggle('hot', !!w);
  $('#n-board').textContent = b; $('#n-board').classList.toggle('hot', !!b);
  const f = focus && document.getElementById(focus);
  if (f) { f.focus(); if (caret != null && f.setSelectionRange) f.setSelectionRange(caret, caret); }
}
async function load() {
  try {
    const [h, d, b] = await Promise.all(['/api/home', '/api/desk', '/api/board'].map((u) => fetch(u, { cache: 'no-store' }).then((r) => r.json())));
    home = h; desk = d; board = b;
    // the header carries the interface's name the way the films print it: Jarvis becomes J.A.R.V.I.S.
    const role = h.hq.role || 'HQ', mark = /^[A-Za-z]{3,10}$/.test(role) ? role.toUpperCase().split('').join('.') + '.' : role.toUpperCase();
    $('#name').textContent = mark; document.title = `${role} · ${h.name}`;
    $('#who').textContent = [h.name, h.director && h.director !== 'the director' ? `${h.director}, director` : ''].filter(Boolean).join(' · ');
    render();
  } catch { $('#main').innerHTML = '<div class="empty"><b>HQ could not be read</b>Is the dashboard server running? node dashboard/serve.mjs</div>'; }
}
async function post(url, data) {
  const r = await fetch(url, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(data) });
  const o = await r.json(); if (!r.ok) throw Object.assign(new Error(o.error || 'not sent'), { log: o.log }); return o;
}
const noteOf = (id) => document.getElementById('note-' + id)?.value.trim() || '';
document.addEventListener('click', async (e) => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.tab || b.dataset.go) { tab = b.dataset.tab || b.dataset.go; try { localStorage.setItem('hq-tab', tab); } catch {} return render(); }
  if (b.dataset.view) { showAnswered = b.dataset.view === 'answered'; return render(); }
  if (b.dataset.copy) { try { await navigator.clipboard.writeText(b.dataset.copy); toast('Folder copied: open Claude Code there'); } catch { toast(b.dataset.copy); } return; }
  if (b.dataset.open === 'recruit') { $('#r-log').hidden = true; return $('#recruit').showModal(); }
  if (b.dataset.open === 'pin') {
    if (!home.labs.length) return toast('Recruit a role first: a job needs a lab');
    $('#p-lab').innerHTML = home.labs.map((l) => `<option value="${esc(l.path)}">${esc(l.role || l.holder)} · ${esc(l.path)}</option>`).join('');
    return $('#pin').showModal();
  }
  if (b.dataset.pick) { const id = b.dataset.pick; picked[id] = { v: b.dataset.v, choice: b.dataset.k, label: b.dataset.t, note: noteOf(id) }; render(); return document.getElementById('note-' + id)?.focus(); }
  if (b.dataset.cancel) { delete picked[b.dataset.cancel]; return render(); }
  if (b.dataset.change) { const id = b.dataset.change, r = desk.replies[id]; picked[id] = { v: r.v, choice: r.choice, label: r.choice ? r.label : undefined, note: r.note }; return render(); }
  if (b.dataset.confirm) {
    const id = b.dataset.confirm, p = picked[id], note = noteOf(id);
    if (NEEDS_NOTE[p.v] && !note) { toast(p.v === 'problem' ? 'Say what happened first' : "Say what's wrong first"); return document.getElementById('note-' + id).focus(); }
    const rec = { v: p.v, choice: p.choice, label: p.label, note: note || undefined };
    try { await post('/api/desk', { id, ...rec }); desk.replies[id] = { ...rec, at: new Date().toISOString() }; delete picked[id]; render(); toast(p.v === 'later' ? 'Sent: kept on your desk' : 'Sent: moved to Answered'); }
    catch (err) { toast('Not sent: ' + err.message); }
  }
  if (b.dataset.answer) {
    const id = b.dataset.answer, text = document.getElementById('ans-' + id).value.trim();
    if (!text) { toast('Say the answer first'); return document.getElementById('ans-' + id).focus(); }
    try { await post('/api/board', { id, answer: text }); toast('Sent: the job is pinned again with your answer'); await load(); }
    catch (err) { toast('Not sent: ' + err.message); }
    return;
  }
  if (b.dataset.tap) {
    b.disabled = true;
    try { const o = await post('/api/board', { id: b.dataset.tap }); board.cards.find((c) => c.id === b.dataset.tap).tapped = o.tapped; render(); toast('Tapped: it gets taken next'); }
    catch (err) { b.disabled = false; toast('Not tapped: ' + err.message); }
  }
});
document.addEventListener('input', (e) => { const m = e.target.id?.match(/^note-(.+)$/); if (m && picked[m[1]]) picked[m[1]].note = e.target.value; });
$('#recruit-form').addEventListener('submit', async (e) => {
  if (e.submitter?.value !== 'go') return;
  e.preventDefault();
  const v = (id) => $('#' + id).value.trim(), go = $('#r-go'), log = $('#r-log');
  go.disabled = true; go.textContent = 'Recruiting...';
  try {
    const o = await post('/api/recruit', { name: v('r-name'), role: v('r-role'), lab: v('r-lab'), what: v('r-what'), does: v('r-does') || undefined });
    log.textContent = o.log; log.hidden = false; toast(`${v('r-name')} recruited: a first-day card is on your desk`);
    $('#recruit-form').reset(); await load();
  } catch (err) { log.textContent = err.log || err.message; log.hidden = false; toast('Not recruited: see the log'); }
  go.disabled = false; go.textContent = 'Recruit';
});
$('#pin-form').addEventListener('submit', async (e) => {
  if (e.submitter?.value !== 'go') return;
  e.preventDefault();
  try { await post('/api/pin', { task: $('#p-task').value.trim(), lab: $('#p-lab').value }); $('#pin').close(); $('#pin-form').reset(); toast('Pinned'); await load(); }
  catch (err) { toast('Not pinned: ' + err.message); }
});
function tick() { const d = new Date(); $('#time').textContent = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' }); $('#date').textContent = d.toLocaleDateString([], { weekday: 'short', day: 'numeric', month: 'short' }) + ' · online'; }
tick(); setInterval(tick, 1000);
load(); setInterval(() => { if (!Object.keys(picked).length && !document.activeElement?.matches('textarea, input, select') && !document.querySelector('dialog[open]')) load(); }, 15000);
</script>
</body>
</html>
